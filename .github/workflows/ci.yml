name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Tür denetimi, lint, birim testleri ve derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: Tarayıcı testleri (başsız Chrome)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Testler sistemdeki Chrome'u kullanır; GitHub'ın Ubuntu makinesinde kuruludur.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-sonuclari
          path: test-results/
          retention-days: 7
